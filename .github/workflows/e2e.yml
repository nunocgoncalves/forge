name: e2e

on:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "test/e2e/**"
      - ".github/workflows/e2e.yml"
  schedule:
    # One nightly integration burst. Kind contracts run independently and the
    # GPU job skips visibly when DigitalOcean has no capacity.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    name: harness-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: compile scenarios and test harness internals
        run: make test-e2e-unit
      - name: lint nested E2E module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: test/e2e

  digitalocean-cpu:
    name: digitalocean-cpu
    if: github.event_name != 'schedule'
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: e2e-digitalocean-cpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: composed CPU E2E
        run: make test-e2e
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  digitalocean-gpu:
    name: digitalocean-gpu
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: e2e-digitalocean-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: composed GPU E2E
        run: make test-e2e-gpu
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kind:
    name: kind-${{ matrix.name }}
    if: github.event_name != 'schedule'
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controlplane-identity
            target: test-e2e-controlplane
            timeout: 20
          - name: inference-contract
            target: test-e2e-inference
            timeout: 20
          - name: cert-issuers
            target: test-e2e-cert-issuers
            timeout: 20
          - name: internal-tls
            target: test-e2e-internal-tls
            timeout: 25
          - name: tool-runner-contract
            target: test-e2e-tool-runner
            timeout: 35
    concurrency:
      group: e2e-kind-${{ matrix.name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: resolve coordinated ticket branches
        id: coordinated-refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ticket=$(printf '%s' "${GITHUB_HEAD_REF:-}" | grep -oE '^HOR-[0-9]+' || true)
          resolve_ref() {
            local repository=$1
            if [ -n "$ticket" ]; then
              gh api --paginate "repos/$repository/branches?per_page=100" \
                --jq ".[] | select(.name | startswith(\"${ticket}-\")) | .name" | head -1
            fi
          }
          control_plane_ref=$(resolve_ref nunocgoncalves/control-plane)
          charts_ref=$(resolve_ref nunocgoncalves/iterabase-charts)
          if [ -n "$control_plane_ref" ] && [ -n "$charts_ref" ]; then
            {
              echo "mode=source-composed"
              echo "control_plane_ref=$control_plane_ref"
              echo "charts_ref=$charts_ref"
              echo "control_plane_root=$GITHUB_WORKSPACE/dependencies/control-plane"
              echo "charts_root=$GITHUB_WORKSPACE/dependencies/iterabase-charts"
              echo "platform_local_chart=$GITHUB_WORKSPACE/dependencies/iterabase-charts/charts/iterabase-platform"
              echo "control_plane_local_chart=$GITHUB_WORKSPACE/dependencies/iterabase-charts/charts/control-plane"
            } >> "$GITHUB_OUTPUT"
          else
            echo "mode=pinned-release" >> "$GITHUB_OUTPUT"
            echo "No complete coordinated branch pair for ${ticket:-non-ticket run}; using reviewed pinned releases."
          fi
      - name: checkout coordinated control-plane source
        if: steps.coordinated-refs.outputs.mode == 'source-composed'
        uses: actions/checkout@v7
        with:
          repository: nunocgoncalves/control-plane
          ref: ${{ steps.coordinated-refs.outputs.control_plane_ref }}
          path: dependencies/control-plane
      - name: checkout coordinated chart source
        if: steps.coordinated-refs.outputs.mode == 'source-composed'
        uses: actions/checkout@v7
        with:
          repository: nunocgoncalves/iterabase-charts
          ref: ${{ steps.coordinated-refs.outputs.charts_ref }}
          path: dependencies/iterabase-charts
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: install kind, helm, and kubectl
        run: |
          curl -sSL -o /tmp/kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -sSL https://get.helm.sh/helm-v3.18.0-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -sSL -o /tmp/kubectl "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: build coordinated chart dependencies
        if: steps.coordinated-refs.outputs.mode == 'source-composed' && matrix.name != 'tool-runner-contract'
        run: |
          helm dependency build dependencies/iterabase-charts/charts/control-plane
          if [ "${{ matrix.name }}" != "controlplane-identity" ]; then
            helm dependency build dependencies/iterabase-charts/charts/cert-manager-substrate
            helm dependency build dependencies/iterabase-charts/charts/iterabase-platform
          fi
      - name: run ${{ matrix.name }} (${{ steps.coordinated-refs.outputs.mode }})
        run: make ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERABASE_CONTROL_PLANE_ROOT: ${{ matrix.name == 'tool-runner-contract' && steps.coordinated-refs.outputs.control_plane_root || '' }}
          ITERABASE_CHARTS_ROOT: ${{ matrix.name == 'tool-runner-contract' && steps.coordinated-refs.outputs.charts_root || '' }}
          ITERABASE_LOCAL_CHART: ${{ steps.coordinated-refs.outputs.platform_local_chart }}
          ITERABASE_PLATFORM_LOCAL_CHART: ${{ steps.coordinated-refs.outputs.platform_local_chart }}
          CONTROL_PLANE_LOCAL_CHART: ${{ steps.coordinated-refs.outputs.control_plane_local_chart }}

  published-compatibility:
    name: published-latest-${{ matrix.name }}
    if: github.event_name == 'schedule'
    needs: harness
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: controlplane-identity
            target: test-e2e-controlplane
            timeout: 20
          - name: inference-contract
            target: test-e2e-inference
            timeout: 20
          - name: cert-issuers
            target: test-e2e-cert-issuers
            timeout: 20
          - name: internal-tls
            target: test-e2e-internal-tls
            timeout: 25
          - name: tool-runner-contract
            target: test-e2e-tool-runner
            timeout: 35
    concurrency:
      group: e2e-published-latest-${{ matrix.name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: install kind, helm, and kubectl
        run: |
          curl -sSL -o /tmp/kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -sSL https://get.helm.sh/helm-v3.18.0-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -sSL -o /tmp/kubectl "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: run ${{ matrix.name }} against latest published artifacts
        run: make ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_E2E_USE_LATEST_RELEASE: "true"
